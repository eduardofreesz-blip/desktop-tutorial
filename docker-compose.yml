services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-universal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-universal_recargas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Porta interna do Next (Nginx faz proxy pra ela, se você usar)
      PORT: ${PORT:-3005}
      # Persistência da sessão do WhatsApp/Baileys
      WA_AUTH_DIR: ${WA_AUTH_DIR:-/data/wa_auth}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    volumes:
      - wa_auth:/data/wa_auth

volumes:
  postgres_data:
  wa_auth:
